name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check, lint, and test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
      - name: Check formatting
        run: cargo fmt --check
      - name: Cargo check
        run: cargo check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Cargo test
        run: cargo test
