<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc">
  <title id="title">DeskCrate — Native Windows Desktop Organizer in Pure Rust</title>
  <desc id="desc">Original vector illustration showing DeskCrate's translucent Mica desktop folder grid, a folded smart capsule pill, and a screen-edge drawer tab over a calm slate-blue desktop backdrop.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A101D"/>
      <stop offset="0.52" stop-color="#111C30"/>
      <stop offset="1" stop-color="#172740"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="76%" cy="32%" r="44%">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#2563EB" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#0A101D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowMint" cx="62%" cy="84%" r="36%">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#0A101D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="glassCard" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#263752" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#162236" stop-opacity="0.82"/>
    </linearGradient>
    <linearGradient id="capsuleBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A3E5E" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#1A2942" stop-opacity="0.90"/>
    </linearGradient>
    <linearGradient id="folderGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FCD34D"/>
      <stop offset="1" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="folderBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="folderMint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#0D9488"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#93C5FD" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="cardShadow" x="-15%" y="-15%" width="135%" height="145%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#030712" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Canvas & atmospheric lighting -->
  <rect width="1440" height="480" rx="20" fill="url(#bg)"/>
  <rect width="1440" height="480" rx="20" fill="url(#glowCyan)"/>
  <rect width="1440" height="480" rx="20" fill="url(#glowMint)"/>
  <rect width="1440" height="480" rx="20" fill="url(#grid)"/>
  <rect x="16" y="16" width="1408" height="448" rx="14" fill="none" stroke="#60A5FA" stroke-opacity="0.14" stroke-width="1"/>

  <!-- Left editorial typography -->
  <rect x="76" y="64" width="68" height="4" rx="2" fill="url(#accent)"/>
  <g font-family="Segoe UI, -apple-system, BlinkMacSystemFont, sans-serif">
    <text x="76" y="106" fill="#7DD3FC" font-size="14" font-weight="700" letter-spacing="3.4">NATIVE WINDOWS DESKTOP ORGANIZER</text>
    <text x="72" y="210" fill="#F8FAFC" font-size="88" font-weight="800" letter-spacing="-2.8">Desk<tspan fill="url(#accent)">Crate</tspan></text>
    <text x="76" y="264" fill="#CBD5E1" font-size="25" font-weight="500">Real folders. Smart capsules. Zero idle cost.</text>
    <text x="76" y="308" fill="#94A3B8" font-size="18">Win32 + DWM Mica/Acrylic + Direct2D in a single portable Rust binary.</text>
    <path d="M76 346H656" stroke="#475569" stroke-opacity="0.55" stroke-width="1"/>
    <text x="76" y="388" fill="#93C5FD" font-size="14" font-weight="700" letter-spacing="2.2">0.95 MB EXE</text>
    <circle cx="204" cy="383" r="2.8" fill="#34D399"/>
    <text x="222" y="388" fill="#93C5FD" font-size="14" font-weight="700" letter-spacing="2.2">~6 MB RAM</text>
    <circle cx="338" cy="383" r="2.8" fill="#34D399"/>
    <text x="356" y="388" fill="#93C5FD" font-size="14" font-weight="700" letter-spacing="2.2">0 MS IDLE CPU</text>
    <circle cx="508" cy="383" r="2.8" fill="#34D399"/>
    <text x="526" y="388" fill="#93C5FD" font-size="14" font-weight="700" letter-spacing="2.2">PURE RUST</text>
    <text x="76" y="428" fill="#64748B" font-size="12" letter-spacing="1.8">PORTABLE  ·  NO INSTALLER  ·  13 LANGUAGES  ·  GPL-3.0-ONLY</text>
  </g>

  <!-- Right visual: Mica Desktop Grid + Smart Capsule + Edge Drawer -->
  <!-- 1. Main Desktop Grid Window -->
  <g filter="url(#cardShadow)">
    <rect x="756" y="62" width="332" height="316" rx="12" fill="url(#glassCard)" stroke="#93C5FD" stroke-opacity="0.28" stroke-width="1.2"/>
    <!-- Title bar -->
    <rect x="774" y="79" width="22" height="18" rx="4" fill="url(#folderBlue)"/>
    <path d="M774 84h8l2-3h12" fill="none" stroke="#DBEAFE" stroke-width="1.2" stroke-opacity="0.7"/>
    <text x="808" y="93" fill="#F1F5F9" font-family="Segoe UI, sans-serif" font-size="15" font-weight="600">Desktop</text>
    <text x="875" y="93" fill="#94A3B8" font-family="Consolas, monospace" font-size="12">12 items</text>
    <!-- Title buttons -->
    <g fill="#94A3B8" opacity="0.85">
      <circle cx="1020" cy="88" r="2"/><circle cx="1027" cy="88" r="2"/><circle cx="1034" cy="88" r="2"/>
      <path d="M1054 91l5-5 5 5" fill="none" stroke="#94A3B8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <path d="M772 110H1072" stroke="#CBD5E1" stroke-opacity="0.18" stroke-width="1"/>

    <!-- 3x2 Icon Grid -->
    <!-- Row 1 -->
    <!-- Selected tile -->
    <rect x="774" y="124" width="90" height="106" rx="8" fill="#FFFFFF" fill-opacity="0.11" stroke="#E2E8F0" stroke-opacity="0.45" stroke-width="1"/>
    <path d="M798 144h16l5 6h21a4 4 0 014 4v26a4 4 0 01-4 4h-42a4 4 0 01-4-4v-32a4 4 0 014-4z" fill="url(#folderGold)"/>
    <text x="819" y="205" text-anchor="middle" fill="#F8FAFC" font-family="Segoe UI, sans-serif" font-size="11.5">Projects</text>

    <!-- Tile 2 -->
    <rect x="876" y="124" width="90" height="106" rx="8" fill="#FFFFFF" fill-opacity="0.03"/>
    <rect x="903" y="142" width="36" height="44" rx="5" fill="#1E293B" stroke="#60A5FA" stroke-width="1.6"/>
    <path d="M911 156h20M911 164h20M911 172h13" stroke="#93C5FD" stroke-width="2" stroke-linecap="round"/>
    <text x="921" y="205" text-anchor="middle" fill="#CBD5E1" font-family="Segoe UI, sans-serif" font-size="11.5">Notes.md</text>

    <!-- Tile 3 -->
    <rect x="978" y="124" width="90" height="106" rx="8" fill="#FFFFFF" fill-opacity="0.03"/>
    <rect x="1003" y="144" width="40" height="40" rx="7" fill="url(#folderMint)"/>
    <circle cx="1016" cy="158" r="4" fill="#F0FDFA"/>
    <path d="M1008 176l9-10 7 6 6-7 8 11z" fill="#0F766E" fill-opacity="0.65"/>
    <text x="1023" y="205" text-anchor="middle" fill="#CBD5E1" font-family="Segoe UI, sans-serif" font-size="11.5">Assets</text>

    <!-- Row 2 -->
    <rect x="774" y="242" width="90" height="106" rx="8" fill="#FFFFFF" fill-opacity="0.03"/>
    <rect x="801" y="260" width="36" height="44" rx="5" fill="#1E293B" stroke="#34D399" stroke-width="1.6"/>
    <text x="819" y="287" text-anchor="middle" fill="#34D399" font-family="Consolas, monospace" font-size="13" font-weight="700">RS</text>
    <text x="819" y="323" text-anchor="middle" fill="#CBD5E1" font-family="Segoe UI, sans-serif" font-size="11.5">config.toml</text>

    <rect x="876" y="242" width="90" height="106" rx="8" fill="#FFFFFF" fill-opacity="0.03"/>
    <path d="M900 262h16l5 6h21a4 4 0 014 4v26a4 4 0 01-4 4h-42a4 4 0 01-4-4v-32a4 4 0 014-4z" fill="url(#folderBlue)"/>
    <text x="921" y="323" text-anchor="middle" fill="#CBD5E1" font-family="Segoe UI, sans-serif" font-size="11.5">Releases</text>

    <rect x="978" y="242" width="90" height="106" rx="8" fill="#FFFFFF" fill-opacity="0.03"/>
    <rect x="1005" y="260" width="36" height="44" rx="5" fill="#1E293B" stroke="#F472B6" stroke-width="1.6"/>
    <path d="M1014 276h18M1014 284h12" stroke="#F9A8D4" stroke-width="2" stroke-linecap="round"/>
    <text x="1023" y="323" text-anchor="middle" fill="#CBD5E1" font-family="Segoe UI, sans-serif" font-size="11.5">Design.pdf</text>

    <!-- Snapped glowing edge indicator -->
    <rect x="1086" y="88" width="3" height="264" rx="1.5" fill="url(#accent)" opacity="0.8"/>
  </g>

  <!-- 2. Smart Capsule Pill (docked top-right) -->
  <g filter="url(#cardShadow)">
    <rect x="1114" y="84" width="248" height="58" rx="29" fill="url(#capsuleBg)" stroke="#7DD3FC" stroke-opacity="0.45" stroke-width="1.3"/>
    <circle cx="1146" cy="113" r="14" fill="#0EA5E9" fill-opacity="0.22" stroke="#38BDF8" stroke-width="1.2"/>
    <path d="M1146 106v10m-4-4l4 4 4-4" fill="none" stroke="#7DD3FC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1172" y="109" fill="#F8FAFC" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600">Downloads</text>
    <text x="1172" y="127" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="11.5">report-v2.pdf · just now</text>
    <rect x="1318" y="101" width="30" height="24" rx="12" fill="#38BDF8" fill-opacity="0.18"/>
    <text x="1333" y="117" text-anchor="middle" fill="#7DD3FC" font-family="Consolas, monospace" font-size="12" font-weight="700">24</text>
  </g>

  <!-- 3. Second Smart Capsule + Quick Filter Preview -->
  <g filter="url(#cardShadow)">
    <rect x="1114" y="168" width="248" height="110" rx="14" fill="url(#glassCard)" stroke="#34D399" stroke-opacity="0.34" stroke-width="1.2"/>
    <text x="1134" y="194" fill="#5EEAD4" font-family="Consolas, monospace" font-size="11" letter-spacing="1.6">TYPE TO FILTER</text>
    <rect x="1132" y="206" width="212" height="30" rx="7" fill="#0F172A" stroke="#34D399" stroke-opacity="0.55" stroke-width="1.1"/>
    <text x="1144" y="225" fill="#E2E8F0" font-family="Consolas, monospace" font-size="13">crate|</text>
    <text x="1334" y="225" text-anchor="end" fill="#64748B" font-family="Segoe UI, sans-serif" font-size="11">3 matches</text>
    <text x="1136" y="258" fill="#CBD5E1" font-family="Segoe UI, sans-serif" font-size="12">deskcrate.exe  ·  Everything IPC</text>
  </g>

  <!-- 4. Edge Drawer Tab -->
  <g filter="url(#cardShadow)">
    <rect x="1114" y="302" width="248" height="76" rx="14" fill="url(#glassCard)" stroke="#818CF8" stroke-opacity="0.35" stroke-width="1.2"/>
    <rect x="1352" y="318" width="5" height="44" rx="2.5" fill="#818CF8"/>
    <text x="1134" y="328" fill="#A5B4FC" font-family="Consolas, monospace" font-size="11" letter-spacing="1.6">DRAWER MODE · CTRL+ALT+D</text>
    <g font-family="Segoe UI, sans-serif" font-size="12">
      <rect x="1134" y="340" width="66" height="24" rx="6" fill="#6366F1" fill-opacity="0.28" stroke="#818CF8" stroke-opacity="0.5"/>
      <text x="1167" y="356" text-anchor="middle" fill="#E0E7FF" font-weight="600">Desktop</text>
      <rect x="1208" y="340" width="76" height="24" rx="6" fill="#FFFFFF" fill-opacity="0.06"/>
      <text x="1246" y="356" text-anchor="middle" fill="#94A3B8">Downloads</text>
      <rect x="1292" y="340" width="48" height="24" rx="6" fill="#FFFFFF" fill-opacity="0.06"/>
      <text x="1316" y="356" text-anchor="middle" fill="#94A3B8">Work</text>
    </g>
  </g>

  <!-- Subtle bottom-right signature -->
  <text x="1362" y="428" text-anchor="end" fill="#475569" font-family="Consolas, monospace" font-size="11.5" letter-spacing="1.5">WIN32 · DIRECT2D · MICA · ZERO BINARY ASSETS</text>
</svg>
